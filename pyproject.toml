[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-consultant-portal"
version = "0.1.0"
description = "Local web portal for Odoo consultants"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "click>=8.1",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.18",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "gitpython>=3.1",
    "keyring>=25.2",
    "openpyxl>=3.1",
    "tabulate>=0.9",
    "rich>=13.7",
    "mcp>=1.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-generativeai>=0.8.0",
    "pypdf>=5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "packaging>=23.0",
]

[project.scripts]
odoo-portal = "odoo_consultant_portal.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["odoo_consultant_portal*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
