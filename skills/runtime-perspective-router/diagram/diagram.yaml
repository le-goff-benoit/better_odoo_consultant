inputs:
  - Prompt utilisateur
  - Perspective explicite (toggle UI)
  - Profil utilisateur
inputs_en:
  - User prompt
  - Explicit perspective (UI toggle)
  - User profile
steps:
  - "Si une perspective explicite est fournie → l'utiliser"
  - "Sinon, scorer les mots-clés du prompt par rôle"
  - "Charger l'agent résolu depuis agents/<slug>/AGENT.md"
  - Injecter les consignes de rôle et de format au début du system prompt
steps_en:
  - If an explicit perspective is provided → use it
  - "Otherwise, score prompt keywords per role"
  - "Load the resolved agent from agents/<slug>/AGENT.md"
  - Inject role and output-format guidance at the top of the system prompt
outputs:
  - "Bloc Markdown 'profil' injecté"
  - Rôle effectif renvoyé au frontend
outputs_en:
  - "'Profile' Markdown block injected"
  - Effective role returned to the frontend
notes: "Désactivé → l'assistant répond sans biais de rôle (ton générique développeur)."
notes_en: Disabled → the assistant answers with no role bias (generic developer tone).
